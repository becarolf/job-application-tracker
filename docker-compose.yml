services:
  postgres:
    image: postgres:16
    container_name: job_tracker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: job_tracker_user
      POSTGRES_PASSWORD: job_tracker_password
      POSTGRES_DB: job_tracker
    ports:
    - "5433:5432"
    volumes:
    - job_tracker_postgres_data:/var/lib/postgresql/job_tracker_postgres_data

volumes:
  job_tracker_postgres_data: